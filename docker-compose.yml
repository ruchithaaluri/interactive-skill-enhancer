version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: skill_enhancer_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skill_enhancer_backend
    ports:
      - "8000:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=interactive_skill_enhancer
      - JWT_SECRET=production_super_secret_jwt_key_skill_enhancer_2026
    depends_on:
      - mongodb
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skill_enhancer_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  mongo_data:
